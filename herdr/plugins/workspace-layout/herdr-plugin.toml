id = "mtfu.workspace-layout"
name = "Workspace Layout"
version = "0.1.0"
min_herdr_version = "0.9.3"
description = "Lay out every new workspace: Copilot in a zoomed left pane, nvim on the right"
platforms = ["windows"]

[[events]]
on = "workspace.created"
command = ["powershell.exe", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "split-and-zoom.ps1"]
