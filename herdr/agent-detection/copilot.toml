# Local override of herdr's Copilot detection manifest (remote 2026.08.29.1), adapted to Copilot 1.0.109:
# - working_footer: it shows "◎ Working · ... ctrl+c interrupt" instead of any "esc ..." hint, so herdr fell back to idle.
# - selection_footer_blocker: approval prompts say "enter select · esc cancel", so they showed as working instead of blocked.
# Overrides always win over remote updates: drop this file once herdr's own manifest matches the new footer.
id = "copilot"
version = "2026.11.12.2"
min_engine_version = 1
updated_at = "2026-11-12T00:00:00Z"
aliases = ["github-copilot", "ghcs"]

[[rules]]
id = "selection_blocker"
state = "blocked"
priority = 300
region = "whole_recent"
visible_blocker = true
all = [
  { any = [
    { contains = ["esc to cancel"] },
    { contains = ["esc cancel"] },
  ] },
  { any = [
    { contains = ["enter to select"] },
    { contains = ["enter to confirm"] },
    { contains = ["enter to submit"] },
    { contains = ["enter accept"] },
  ] },
]

# Bottom lines only, full footer line: transcript text quoting the hint must not count as blocked.
[[rules]]
id = "selection_footer_blocker"
state = "blocked"
priority = 290
region = "bottom_non_empty_lines(4)"
visible_blocker = true
line_regex = ['navigate\s*·.*enter select\s*·\s*esc cancel']

[[rules]]
id = "background_agents_working"
state = "working"
priority = 110
region = "bottom_non_empty_lines(6)"
visible_working = true
line_regex = ['^\s*◎\s+Waiting for background agents(?:\s|·|$)']

# Bottom lines only: "ctrl+c interrupt" anywhere in the transcript must not count as working.
[[rules]]
id = "working_footer"
state = "working"
priority = 105
region = "bottom_non_empty_lines(3)"
visible_working = true
line_regex = ['^\s*\S\s+Working\b.*ctrl\+c interrupt']

[[rules]]
id = "working_cancel_hint"
state = "working"
priority = 100
region = "whole_recent"
visible_working = true
any = [
  { contains = ["esc to cancel"] },
  { contains = ["esc cancel"] },
  { contains = ["esc again to cancel"] },
  { contains = ["esc interrupt"] }
]
